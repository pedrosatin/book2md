[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book2md"
version = "0.1.0"
description = "Convert EPUB, MOBI, and text-based PDF books to Markdown"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "book2md contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
book2md = "book2md.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

